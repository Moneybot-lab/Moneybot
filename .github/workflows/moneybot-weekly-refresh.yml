name: Moneybot Weekly Refresh

on:
  schedule:
    # 12:00 UTC every Sunday (6:00 AM MDT during daylight saving)
    - cron: '0 12 * * 0'
  workflow_dispatch:

jobs:
  trigger-weekly-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: moneybot-production-ops
      cancel-in-progress: false

    steps:
      - name: Validate required secrets
        env:
          MONEYBOT_BASE_URL: ${{ secrets.MONEYBOT_BASE_URL }}
          DAILY_OPS_TOKEN: ${{ secrets.DAILY_OPS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MONEYBOT_BASE_URL" || (echo "Missing secret: MONEYBOT_BASE_URL" && exit 1)
          test -n "$DAILY_OPS_TOKEN" || (echo "Missing secret: DAILY_OPS_TOKEN" && exit 1)

      - name: Trigger /api/run-weekly-model-refresh
        env:
          MONEYBOT_BASE_URL: ${{ secrets.MONEYBOT_BASE_URL }}
          DAILY_OPS_TOKEN: ${{ secrets.DAILY_OPS_TOKEN }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          # No automatic POST retries: a lost response does not prove the job stopped.
          # Re-running this Actions run reuses its durable backend receipt for seven days.
          http_code="$(curl -sS --connect-timeout 15 --max-time 1080 --max-filesize 65536 \
            --output "$response_file" --write-out "%{http_code}" \
            -X POST "$MONEYBOT_BASE_URL/api/run-weekly-model-refresh" \
            -H "X-Daily-Ops-Token: $DAILY_OPS_TOKEN" \
            -H "Idempotency-Key: run-weekly-model-refresh-${GITHUB_RUN_ID:-local}" \
            -H "Content-Type: application/json")" || curl_status=$?
          export response_file
          # Parse a bounded body and print only operational fields; never raw HTML/payloads.
          python3 - <<'PYCODE'
          import json, os, re
          try:
              with open(os.environ["response_file"], "rb") as fh:
                  body = json.loads(fh.read(65537))
              data = body.get("data", {})
              safe = {k: data[k] for k in ("success", "status", "returncode", "failed_stage", "replayed") if k in data}
              safe["request_id"] = body.get("request_id")
              rendered = json.dumps(safe, separators=(",", ":"))
              for key in ("DAILY_OPS_TOKEN", "MONEYBOT_BASE_URL"):
                  value = os.environ.get(key)
                  if value:
                      rendered = rendered.replace(value, "[REDACTED]")
              print(re.sub(r"[\x00-\x1f\x7f]", "", rendered)[:4096])
          except (ValueError, OSError, AttributeError, TypeError):
              print("Backend response unavailable or invalid JSON (body suppressed)")
          PYCODE
          if [ "${curl_status:-0}" -ne 0 ]; then
            echo "Weekly Refresh request failed at transport layer; curl exit=$curl_status"
            exit "$curl_status"
          fi
          echo "Weekly Refresh HTTP status: $http_code"
          if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "Weekly Refresh returned non-success HTTP status: $http_code"
            exit 1
          fi
          python3 - <<'PYCODE'
          import json, os, sys
          try:
              with open(os.environ["response_file"], "rb") as fh:
                  success = json.loads(fh.read(65537)).get("data", {}).get("success") is True
          except (ValueError, OSError, AttributeError):
              success = False
          if not success:
              print("Backend did not confirm successful execution")
          sys.exit(0 if success else 1)
          PYCODE
