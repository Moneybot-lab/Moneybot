name: Track B Offline Challenger

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      massive_prefix:
        description: "Massive flat-files prefix to ingest"
        required: true
        default: "us_stocks_sip/day_aggs_v1"
        type: string
      dataset_date:
        description: "Immutable ingest date folder (YYYY-MM-DD); leave blank for current UTC date"
        required: false
        default: ""
        type: string
      min_rows:
        description: "Minimum rows required for challenger training/backtest gates"
        required: true
        default: "200"
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONPATH: ${{ github.workspace }}
  MASSIVE_FLATFILES_PREFIX: ${{ inputs.massive_prefix || 'us_stocks_sip/day_aggs_v1' }}
  MASSIVE_INGEST_DATE: ${{ inputs.dataset_date || '' }}
  TRACK_B_MIN_ROWS: ${{ inputs.min_rows || '200' }}
  V4_FEATURE_CONTRACT_VERSION: alpha-atlas-v4-features.v2
  V4_CANONICALIZATION_CONTRACT_VERSION: alpha-atlas-v4-canonical-observation.v2
  V4_CANONICAL_OBSERVATION_SCHEMA: alpha-atlas-v4-canonical-observations.v2
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  AWS_DEFAULT_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: "true"
  TRACK_B_RUN_DIR: data/track_b/runs/${{ github.run_id }}-${{ github.run_attempt }}
  RAW_V4_ROWS: data/track_b/runs/${{ github.run_id }}-${{ github.run_attempt }}/raw/decision_training_snapshot_massive.jsonl
  RAW_V4_MANIFEST: data/track_b/runs/${{ github.run_id }}-${{ github.run_attempt }}/raw/decision_training_snapshot_massive.jsonl.manifest.json
  CANONICAL_DIR: data/track_b/runs/${{ github.run_id }}-${{ github.run_attempt }}/canonical
  CANONICAL_OBSERVATIONS: data/track_b/runs/${{ github.run_id }}-${{ github.run_attempt }}/canonical/canonical_observations.jsonl
  REQUEST_OBSERVATION_MAP: data/track_b/runs/${{ github.run_id }}-${{ github.run_attempt }}/canonical/request_to_observation_map.jsonl
  CANONICAL_DIAGNOSTICS: data/track_b/runs/${{ github.run_id }}-${{ github.run_attempt }}/canonical/canonicalization_diagnostics.json
  CANONICAL_MANIFEST: data/track_b/runs/${{ github.run_id }}-${{ github.run_attempt }}/canonical/canonical_observations.jsonl.manifest.json
  CLEANED_DIR: data/track_b/runs/${{ github.run_id }}-${{ github.run_attempt }}/training_quality
  CLEANED_OBSERVATIONS: data/track_b/runs/${{ github.run_id }}-${{ github.run_attempt }}/training_quality/cleaned_all.jsonl
  CLEANING_QUALITY_REPORT: data/track_b/runs/${{ github.run_id }}-${{ github.run_attempt }}/training_quality/model_quality_report.json
  FEATURE_STORE_DIR: data/track_b/runs/${{ github.run_id }}-${{ github.run_attempt }}/flat_feature_store
  PHASE0_DIR: data/track_b/runs/${{ github.run_id }}-${{ github.run_attempt }}/phase0
  TRACK_B_ARTIFACT_DIR: data/track_b/runs/${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  run-track-b:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt awscli
          aws --version

      - name: Validate Massive flat-file secrets
        env:
          MASSIVE_FLATFILES_ACCESS_KEY_ID: ${{ secrets.MASSIVE_FLATFILES_ACCESS_KEY_ID }}
          MASSIVE_FLATFILES_SECRET_ACCESS_KEY: ${{ secrets.MASSIVE_FLATFILES_SECRET_ACCESS_KEY }}
          MASSIVE_FLATFILES_ENDPOINT: ${{ secrets.MASSIVE_FLATFILES_ENDPOINT }}
          MASSIVE_FLATFILES_BUCKET: ${{ secrets.MASSIVE_FLATFILES_BUCKET }}
        run: python3 scripts/check_massive_flatfiles_env.py --prefix "$MASSIVE_FLATFILES_PREFIX"

      - name: Verify API connectivity
        env:
          MONEYBOT_BASE_URL: ${{ secrets.MONEYBOT_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$MONEYBOT_BASE_URL" || (echo "Missing secret: MONEYBOT_BASE_URL" && exit 1)
          echo "Testing API connectivity to MoneyBot model-health endpoint..."
          timeout 30 curl --head --fail --silent --show-error --location \
            "$MONEYBOT_BASE_URL/api/model-health" || \
            echo "Warning: Could not reach /api/model-health during connectivity check; continuing to decision-log export diagnostics."

      - name: Fetch real decision log export
        env:
          MONEYBOT_BASE_URL: ${{ secrets.MONEYBOT_BASE_URL }}
          DAILY_OPS_TOKEN: ${{ secrets.DAILY_OPS_TOKEN }}
        run: |
          set -euo pipefail
          echo "TRACK_B_FAILED_STAGE=fetch_decision_log" >> "$GITHUB_ENV"
          test -n "$MONEYBOT_BASE_URL" || (echo "Missing secret: MONEYBOT_BASE_URL" && exit 1)
          test -n "$DAILY_OPS_TOKEN" || (echo "Missing secret: DAILY_OPS_TOKEN" && exit 1)
          mkdir -p data "$TRACK_B_RUN_DIR"

          CURL_OPTS=(
            --fail
            --show-error
            --silent
            --retry 3
            --retry-delay 3
            --retry-all-errors
            --connect-timeout 15
            --max-time 120
            --location
            --output data/decision_events.jsonl
            --dump-header data/_response_headers.txt
            --write-out '%{http_code}'
            -H "X-Daily-Ops-Token: $DAILY_OPS_TOKEN"
          )

          URL="$MONEYBOT_BASE_URL/api/export-decision-log"
          echo "Fetching decision log from: $URL"
          set +e
          HTTP_STATUS=$(timeout 150 curl "${CURL_OPTS[@]}" "$URL")
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "curl failed with exit code: $CURL_EXIT"
            echo "Response headers:"
            sed -n '1,200p' data/_response_headers.txt || true
            if [ -s data/decision_events.jsonl ]; then
              echo "Partial response (first 50 lines):"
              head -n 50 data/decision_events.jsonl || true
            fi
            echo "Decision log fetch failed. Exiting."
            exit 1
          fi

          python3 scripts/validate_decision_log_export.py \
            --artifact data/decision_events.jsonl \
            --headers data/_response_headers.txt \
            --manifest-output data/decision_log_export_manifest.json \
            --latest-allowed-earliest-timestamp 1775629100 \
            --final-status "$HTTP_STATUS"
          echo "Decision log lines:"
          wc -l data/decision_events.jsonl
          echo "Response headers (first 100 lines):"
          sed -n '1,100p' data/_response_headers.txt || true

      - name: Fetch current production model artifact
        env:
          MONEYBOT_BASE_URL: ${{ secrets.MONEYBOT_BASE_URL }}
          DAILY_OPS_TOKEN: ${{ secrets.DAILY_OPS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MONEYBOT_BASE_URL" || (echo "Missing secret: MONEYBOT_BASE_URL" && exit 1)
          test -n "$DAILY_OPS_TOKEN" || (echo "Missing secret: DAILY_OPS_TOKEN" && exit 1)
          mkdir -p data/track_b
          URL="$MONEYBOT_BASE_URL/api/export-production-model"
          echo "Fetching production model artifact from: $URL"
          timeout 60 curl --fail --show-error --silent --retry 3 --retry-delay 3 --retry-all-errors --location \
            --output data/track_b/production_model.json \
            --dump-header data/track_b/_production_model_headers.txt \
            -H "X-Daily-Ops-Token: $DAILY_OPS_TOKEN" \
            "$URL"
          test -s data/track_b/production_model.json || (echo "Exported production model is empty" && exit 1)
          python3 -m json.tool data/track_b/production_model.json >/dev/null
          echo "Production model response headers:"
          sed -n '1,100p' data/track_b/_production_model_headers.txt || true

      - name: Ingest Massive flat files into immutable dated folder
        env:
          MASSIVE_FLATFILES_ACCESS_KEY_ID: ${{ secrets.MASSIVE_FLATFILES_ACCESS_KEY_ID }}
          MASSIVE_FLATFILES_SECRET_ACCESS_KEY: ${{ secrets.MASSIVE_FLATFILES_SECRET_ACCESS_KEY }}
          MASSIVE_FLATFILES_ENDPOINT: ${{ secrets.MASSIVE_FLATFILES_ENDPOINT }}
          MASSIVE_FLATFILES_BUCKET: ${{ secrets.MASSIVE_FLATFILES_BUCKET }}
        run: |
          set -euo pipefail
          args=(--prefix "$MASSIVE_FLATFILES_PREFIX" --destination-root data/raw/massive_flatfiles)
          if [ -n "$MASSIVE_INGEST_DATE" ]; then
            args+=(--dataset-date "$MASSIVE_INGEST_DATE")
          fi
          python3 scripts/ingest_massive_flatfiles.py "${args[@]}"

      - name: Materialize point-in-time Massive split metadata
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$MASSIVE_API_KEY" || (echo "Missing secret: MASSIVE_API_KEY; canonical Track B requires corporate-action metadata" && exit 1)
          python3 scripts/fetch_massive_splits.py \
            --decision-log data/decision_events.jsonl \
            --output-dir data/track_b/corporate_actions

      - name: Build leakage-safe Massive decision training rows
        run: |
          set -euo pipefail
          echo "TRACK_B_FAILED_STAGE=build_raw" >> "$GITHUB_ENV"
          timeout 1800 python3 scripts/build_massive_decision_training_rows.py \
            --raw-root data/raw/massive_flatfiles \
            --decision-log data/decision_events.jsonl \
            --output "$RAW_V4_ROWS" \
            --split-cache data/track_b/corporate_actions/massive_splits.jsonl \
            --phase0-evidence-dir "$PHASE0_DIR/source_evidence" \
            --performance-output "$TRACK_B_RUN_DIR/builder_performance.json" \
            --horizon-days 5
          echo "Training-row manifest:"
          test -s "$RAW_V4_ROWS"
          test -s "$RAW_V4_MANIFEST"
          test -s "$PHASE0_DIR/source_evidence/source_evidence_manifest.json"
          test -s "$PHASE0_DIR/source_evidence/evidence_bundle_diagnostics.json"
          find "$PHASE0_DIR/source_evidence" -name 'observation_lineage.part-*.jsonl.gz' -print -quit | grep -q .
          find "$PHASE0_DIR/source_evidence" -name 'selected_market_rows.part-*.jsonl.gz' -print -quit | grep -q .
          find "$PHASE0_DIR/source_evidence" -name 'corporate_action_evidence.part-*.jsonl.gz' -print -quit | grep -q .
          sed -n '1,200p' "$RAW_V4_MANIFEST"

      - name: Validate raw V4 timing and schema
        run: |
          set -euo pipefail
          echo "TRACK_B_FAILED_STAGE=validate_raw" >> "$GITHUB_ENV"
          python3 scripts/validate_alpha_atlas_v4_workflow_artifacts.py \
            --stage raw --rows "$RAW_V4_ROWS" --manifest "$RAW_V4_MANIFEST"

      - name: Canonicalize V4 economic observations
        run: |
          set -euo pipefail
          echo "TRACK_B_FAILED_STAGE=canonicalize" >> "$GITHUB_ENV"
          python3 scripts/canonicalize_alpha_atlas_v4_rows.py \
            --input "$RAW_V4_ROWS" --output-dir "$CANONICAL_DIR"
          test -s "$CANONICAL_OBSERVATIONS"
          test -s "$REQUEST_OBSERVATION_MAP"
          test -s "$CANONICAL_DIAGNOSTICS"
          test -s "$CANONICAL_MANIFEST"

      - name: Validate canonical V4 observations
        run: |
          set -euo pipefail
          echo "TRACK_B_FAILED_STAGE=validate_canonical" >> "$GITHUB_ENV"
          python3 scripts/validate_alpha_atlas_v4_workflow_artifacts.py \
            --stage canonical --rows "$CANONICAL_OBSERVATIONS" --manifest "$CANONICAL_MANIFEST"

      - name: Clean and quality-gate training rows
        run: |
          set -euo pipefail
          echo "TRACK_B_FAILED_STAGE=clean" >> "$GITHUB_ENV"
          test "$CANONICAL_OBSERVATIONS" = "$CANONICAL_DIR/canonical_observations.jsonl"
          python3 scripts/clean_training_snapshot.py \
            --input "$CANONICAL_OBSERVATIONS" \
            --output-dir "$CLEANED_DIR" \
            --max-market-lag-days 3 \
            --train-ratio 0.8

      - name: Materialize reproducible flat feature store
        run: |
          python3 scripts/day15_materialize_flat_feature_store.py \
            --input "$CLEANED_OBSERVATIONS" \
            --output-dir "$FEATURE_STORE_DIR" \
            --train-ratio 0.8

      - name: Evaluate V4 Phase 0 reconstructability gate
        id: phase0_certification
        run: |
          set -euo pipefail
          echo "TRACK_B_FAILED_STAGE=phase0_reconstructability" >> "$GITHUB_ENV"
          mkdir -p "$PHASE0_DIR"
          cp docs/reports/alpha_atlas_v4_feature_registry.json "$PHASE0_DIR/feature_registry.json"
          python3 scripts/verify_alpha_atlas_v4_reconstructability.py \
            --input "$FEATURE_STORE_DIR/all.jsonl" \
            --root "$PHASE0_DIR/source_evidence" \
            --output "$PHASE0_DIR/reconstructability_report.json" \
            --certification-output "$PHASE0_DIR/temporal_safety_certification.json"

      - name: Assess V4 challenger temporal-split feasibility
        id: split_preflight
        run: |
          set -euo pipefail
          echo "TRACK_B_FAILED_STAGE=split_preflight" >> "$GITHUB_ENV"
          python3 scripts/plan_alpha_atlas_v4_temporal_split.py \
            --input "$FEATURE_STORE_DIR/all.jsonl" \
            --output-dir "$TRACK_B_ARTIFACT_DIR/challenger_suite" \
            --train-ratio 0.8 \
            --embargo-sessions 1 \
            --min-train-dates 5 \
            --min-test-dates 2 \
            --min-observations "$TRACK_B_MIN_ROWS"
          test -s "$TRACK_B_ARTIFACT_DIR/challenger_suite/challenger_split_diagnostics.json"
          test -s "$TRACK_B_ARTIFACT_DIR/challenger_suite/challenger_split_plan.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          plan = json.loads((Path(os.environ["TRACK_B_ARTIFACT_DIR"]) / "challenger_suite/challenger_split_plan.json").read_text())
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"status={plan['status']}\n")
              out.write(f"feasible={'true' if plan['status'] == 'FEASIBLE' else 'false'}\n")
          PY

      - name: Train offline challenger suite
        if: steps.split_preflight.outputs.feasible == 'true'
        run: |
          python3 scripts/train_challenger_suite.py \
            --input "$FEATURE_STORE_DIR/all.jsonl" \
            --output-dir "$TRACK_B_ARTIFACT_DIR/challenger_suite" \
            --split-plan "$TRACK_B_ARTIFACT_DIR/challenger_suite/challenger_split_plan.json" \
            --train-ratio 0.8 \
            --horizon-days 5 \
            --min-rows "$TRACK_B_MIN_ROWS"

      - name: Backtest and gate challenger suite
        if: steps.split_preflight.outputs.feasible == 'true'
        run: |
          python3 scripts/backtest_challenger_suite.py \
            --suite-manifest "$TRACK_B_ARTIFACT_DIR/challenger_suite"/challenger_suite_manifest.json \
            --feature-store "$TRACK_B_ARTIFACT_DIR/challenger_suite/challenger_test.jsonl" \
            --output "$TRACK_B_ARTIFACT_DIR/challenger_suite"/backtest_report.json \
            --min-rows "$TRACK_B_MIN_ROWS" \
            --transaction-cost-bps 5 \
            --slippage-bps 5

      - name: Record V3 and V3.1 compatibility boundary
        run: |
          set -euo pipefail
          mkdir -p "$TRACK_B_ARTIFACT_DIR/alpha_atlas_v3" "$TRACK_B_ARTIFACT_DIR/alpha_atlas_v31"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["TRACK_B_ARTIFACT_DIR"])
          status = {
              "schema_version": "alpha-atlas-v4-legacy-comparator-boundary.v1",
              "status": "skipped_incompatible_v4_executable_label_lineage",
              "v4_input_consumed": False,
              "v3_behavior_changed": False,
              "v31_behavior_changed": False,
              "automatic_promotion": False,
              "ready_for_live_routing": False,
          }
          for directory, name in (("alpha_atlas_v3", "v3_generation_status.json"), ("alpha_atlas_v31", "v31_generation_status.json")):
              (root / directory / name).write_text(json.dumps(status, indent=2, sort_keys=True) + "\n")
          PY

      - name: Write controlled insufficient-coverage summary
        if: steps.split_preflight.outputs.feasible != 'true'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["TRACK_B_ARTIFACT_DIR"])
          diagnostics = json.loads((root / "challenger_suite/challenger_split_diagnostics.json").read_text())
          summary = {
              "schema_version": "alpha-atlas-v4-no-candidate.v1",
              "status": "NO_CANDIDATE_INSUFFICIENT_TEMPORAL_COVERAGE",
              "research_only": True,
              "candidate_win": False,
              "automatic_promotion": False,
              "ready_for_live_routing": False,
              "training_attempted": False,
              "backtest_attempted": False,
              "split_diagnostics": diagnostics,
          }
          (root / "no_candidate_insufficient_temporal_coverage.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          PY

      - name: Write V4 research-only run summary
        run: |
          set -euo pipefail
          echo "TRACK_B_FAILED_STAGE=research_summary" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["TRACK_B_ARTIFACT_DIR"])
          canonical = json.loads(Path(os.environ["CANONICAL_DIAGNOSTICS"]).read_text())
          quality = json.loads(Path(os.environ["CLEANING_QUALITY_REPORT"]).read_text())
          split_plan = json.loads((root / "challenger_suite/challenger_split_plan.json").read_text())
          certification_path = Path(os.environ["PHASE0_DIR"]) / "temporal_safety_certification.json"
          certification = json.loads(certification_path.read_text()) if certification_path.is_file() else {"status": "NOT_EVALUATED"}
          summary = {
              "schema_version": "alpha-atlas-v4-track-b-research-run.v1",
              "timing_contract_version": "alpha-atlas-v4-prediction-execution-contract.v1",
              "model_feature_contract_version": os.environ["V4_FEATURE_CONTRACT_VERSION"],
              "canonicalization_contract_version": os.environ["V4_CANONICALIZATION_CONTRACT_VERSION"],
              "canonical_observation_schema": os.environ["V4_CANONICAL_OBSERVATION_SCHEMA"],
              "raw_request_rows": canonical["raw_request_rows"],
              "canonical_observations": canonical["canonical_observations"],
              "cleaned_observations": quality["cleaned_rows"],
              "research_only": True,
              "automatic_promotion": False,
              "ready_for_live_routing": False,
              "v2_production_comparison_performed": False,
              "status": ("completed_research_pipeline" if split_plan["status"] == "FEASIBLE" else split_plan["status"]),
              "phase0_certification_status": certification["status"],
              "phase0_certification_passed": certification["status"] == "VERIFIED_FOR_THIS_ARTIFACT",
              "split_plan_sha256": split_plan["plan_sha256"],
          }
          (root / "track_b_v4_research_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Write sanitized Track B failure summary
        if: failure()
        run: |
          python3 scripts/validate_alpha_atlas_v4_workflow_artifacts.py \
            --stage failure-summary \
            --failed-stage "${TRACK_B_FAILED_STAGE:-unknown}" \
            --input-label "run_scoped_track_b_artifact" \
            --manifest "$CANONICAL_MANIFEST" \
            --output "$TRACK_B_RUN_DIR/track_b_failure_summary.json"

      - name: Upload Track B artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-b-offline-output
          path: |
            ${{ env.RAW_V4_MANIFEST }}
            ${{ env.CANONICAL_DIAGNOSTICS }}
            ${{ env.CANONICAL_MANIFEST }}
            ${{ env.CLEANING_QUALITY_REPORT }}
            ${{ env.PHASE0_DIR }}/**
            ${{ env.FEATURE_STORE_DIR }}/all.jsonl
            ${{ env.TRACK_B_ARTIFACT_DIR }}/challenger_suite/feature_fill_policy.json
            ${{ env.TRACK_B_RUN_DIR }}/track_b_failure_summary.json
            ${{ env.TRACK_B_RUN_DIR }}/builder_performance.json
            data/track_b/**
            ${{ env.TRACK_B_ARTIFACT_DIR }}/alpha_atlas_v3/**
            ${{ env.TRACK_B_ARTIFACT_DIR }}/alpha_atlas_v3/candidate_alpha_atlas_v3_clean.json
            ${{ env.TRACK_B_ARTIFACT_DIR }}/alpha_atlas_v3/alpha_atlas_v3_model_report.json
            ${{ env.TRACK_B_ARTIFACT_DIR }}/alpha_atlas_v3/alpha_atlas_v3_feature_coverage_report.json
            ${{ env.TRACK_B_ARTIFACT_DIR }}/alpha_atlas_v3/alpha_atlas_v3_backtest_report.json
            ${{ env.TRACK_B_ARTIFACT_DIR }}/alpha_atlas_v3/alpha_atlas_v3_representative_serving_dry_runs.json
            ${{ env.TRACK_B_ARTIFACT_DIR }}/alpha_atlas_v3/production_servability_certification.json
            ${{ env.TRACK_B_ARTIFACT_DIR }}/alpha_atlas_v3/alpha_atlas_v3_recovery_rebaseline_report.json
            ${{ env.TRACK_B_ARTIFACT_DIR }}/alpha_atlas_v31/**
            data/decision_events.jsonl
            data/decision_log_export_manifest.json
            data/_response_headers.txt
            data/track_b/_production_model_headers.txt
            data/raw/**/_INGEST_MANIFEST.json
          if-no-files-found: warn
