name: Alpha Atlas V4 Phase 1 Coverage Discovery

on:
  workflow_dispatch:
    inputs:
      live_read_only:
        description: "Explicitly enable bounded live metadata discovery"
        type: boolean
        required: true
        default: false
      max_requests:
        description: "Maximum requests (hard ceiling 200)"
        default: "40"
      max_pages:
        description: "Maximum pages (hard ceiling 200)"
        default: "10"
      max_response_bytes:
        description: "Maximum bytes per response (hard ceiling 5242880)"
        default: "1048576"
      max_total_bytes:
        description: "Maximum total bytes (hard ceiling 104857600)"
        default: "10485760"
      max_elapsed_seconds:
        description: "Maximum elapsed seconds (hard ceiling 900)"
        default: "300"
      max_retries:
        description: "Maximum retries per request (hard ceiling 3)"
        default: "2"
      max_backoff_seconds:
        description: "Maximum backoff seconds (hard ceiling 30)"
        default: "8"

permissions:
  contents: read

concurrency:
  group: alpha-atlas-v4-phase1-coverage-discovery
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  REPORT_DIR: artifacts/alpha-atlas-v4-phase1-coverage-discovery

jobs:
  bounded-metadata-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run bounded metadata discovery
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          LIVE_READ_ONLY: ${{ inputs.live_read_only }}
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          live_arg=()
          if [ "$LIVE_READ_ONLY" = "true" ]; then
            live_arg=(--live)
          fi
          python scripts/discover_alpha_atlas_v4_phase1_coverage.py \
            --output-dir "$REPORT_DIR" "${live_arg[@]}" \
            --max-requests '${{ inputs.max_requests }}' \
            --max-pages '${{ inputs.max_pages }}' \
            --max-response-bytes '${{ inputs.max_response_bytes }}' \
            --max-total-bytes '${{ inputs.max_total_bytes }}' \
            --max-elapsed-seconds '${{ inputs.max_elapsed_seconds }}' \
            --max-retries '${{ inputs.max_retries }}' \
            --max-backoff-seconds '${{ inputs.max_backoff_seconds }}'
      - name: Publish sanitized discovery summary
        if: always()
        run: |
          summary="$REPORT_DIR/alpha_atlas_v4_phase1_coverage_discovery_workflow_summary.md"
          if [ -s "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '# Phase 1 coverage discovery\n\nDiscovery failed before a valid report was produced.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sanitized discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-atlas-v4-phase1-coverage-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/alpha-atlas-v4-phase1-coverage-discovery
          if-no-files-found: warn
          retention-days: 30
